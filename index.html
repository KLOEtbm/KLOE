<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.L.O.E. // Official Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050608;
      color: #e5e9f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 48px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* GLOBAL STREAMING HUB PILLS */
    .top-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 8px;
    }

    .hub-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      background: #090b10;
      border: 1.5px solid #00d2ff;
      border-radius: 6px;
      color: #ffffff;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
      transition: all 0.25s ease;
    }

    .hub-btn:hover {
      background: #00d2ff;
      color: #050608;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
    }

    /* RELEASE CARDS */
    .release-card {
      background: #0a0d14;
      border: 1px solid #141b29;
      border-radius: 10px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .card-meta {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7a889b;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.85rem;
      line-height: 1.45;
      color: #9aa7b8;
      margin-bottom: 18px;
    }

    /* PRIMARY CARD ACTION BUTTON */
    .action-btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      background: #080c14;
      border: 1.5px solid #00d2ff;
      border-radius: 6px;
      color: #00d2ff;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 18px;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: #00d2ff;
      color: #050608;
      box-shadow: 0 0 22px rgba(0, 210, 255, 0.5);
    }

    /* VIDEO WRAPPER 16:9 */
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      border: 1px solid #1a2233;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- GLOBAL STREAMING CHANNELS -->
    <div class="top-links">
      <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" class="hub-btn">Spotify</a>
      <a href="https://music.apple.com" target="_blank" rel="noopener noreferrer" class="hub-btn">Apple Music</a>
      <a href="https://music.amazon.com" target="_blank" rel="noopener noreferrer" class="hub-btn">Amazon Music</a>
    </div>

    <!-- CARD 01: IN THE DARK (STRIKE PHASE) -->
    <article class="release-card">
      <div class="card-meta">Track 02 — Out Now</div>
      <h2 class="card-title">In the Dark</h2>
      <p class="card-desc">
        Midnight park descent. Sub-heavy industrial metal under pale moonlight.
      </p>

      <a href="https://youtu.be/761b1E9vOgE" target="_blank" rel="noopener noreferrer" class="action-btn">
        Stream Master Cut
      </a>

      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/761b1E9vOgE" 
          title="K.L.O.E. - IN THE DARK" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </article>

    <!-- CARD 02: YOUR EVIL QUEEN (THE MONOLITH) -->
    <article class="release-card">
      <div class="card-meta">Track 01 — Album Cycle</div>
      <h2 class="card-title">Your Evil Queen</h2>
      <p class="card-desc">
        The genesis of sovereign authority. Crushing low-end metalcore architecture.
      </p>

      <a href="https://youtu.be/YEQ_VIDEO_ID" target="_blank" rel="noopener noreferrer" class="action-btn">
        Watch Master Video
      </a>

      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/YEQ_VIDEO_ID" 
          title="K.L.O.E. - YOUR EVIL QUEEN" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </article>

  </div>

</body>
</html>
