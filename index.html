<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.L.O.E. | Your Evil Queen</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0d0d0d;
            --border-color: #222222;
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --accent: #d4af37;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            transition: border-color 0.2s;
        }
        .track-card:hover {
            border-color: #444;
        }
        .track-number {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .track-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .track-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--text-primary);
            color: var(--bg-color);
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 3px;
            box-sizing: border-box;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #ffffff;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Replace 'portrait.jpg' with your hosted image filename or direct asset link -->
        <img src="portrait.jpg" alt="K.L.O.E." class="profile-img">
        <h1>K.L.O.E.</h1>
        <div class="subtitle">Your Evil Queen</div>

        <!-- Track 01 -->
        <div class="track-card">
            <div class="track-number">Track 01</div>
            <div class="track-title">Your Evil Queen</div>
            <div class="track-desc">An aggressive fusion of downtuned industrial metalcore and cyber-gothic lore.</div>
            <a href="https://distrokid.com/hyperfollow/kloe6/your-evil-queen/" class="btn" target="_blank">Stream Now</a>
        </div>

        <!-- Track 02 -->
        <div class="track-card">
            <div class="track-number">Track 02 — Out Oct 9</div>
            <div class="track-title">In the Dark</div>
            <div class="track-desc">Midnight park descent. Sub-heavy industrial metal under pale moonlight.</div>
            <a href="https://distrokid.com/hyperfollow/kloe6/in-the-dark/" class="btn" target="_blank">Pre-Save Hub</a>
        </div>
    </div>
</body>
</html>
