<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.L.O.E. | Your Evil Queen</title>
    <style>
        body {
            background-color: #080808;
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .track-card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: left;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .track-desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #080808;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 2px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>K.L.O.E.</h1>
        <div class="subtitle">Your Evil Queen — The Ecosystem</div>

        <!-- Track 01 -->
        <div class="track-card">
            <div class="track-title">Track 01: Your Evil Queen</div>
            <div class="track-desc">An aggressive fusion of downtuned industrial metalcore and cyber-gothic lore.</div>
            <a href="https://distrokid.com/hyperfollow/kloe6/your-evil-queen/" class="btn" target="_blank">Listen / Stream</a>
        </div>

        <!-- Track 02 -->
        <div class="track-card">
            <div class="track-title">Track 02: In the Dark</div>
            <div class="track-desc">Midnight park descent. Sub-heavy industrial metal under pale moonlight. Out October 9.</div>
            <a href="https://distrokid.com/hyperfollow/kloe6/in-the-dark/" class="btn" target="_blank">Pre-Save / Watch</a>
